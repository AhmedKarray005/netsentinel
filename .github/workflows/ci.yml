# Runs on every push and pull request: lint + tests (backend, frontend), then builds both
# container images and scans them and the dependencies with Trivy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # least privilege: the jobs only read the code

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (a tag can be moved to malicious code,
# as happened to trivy-action in 2026); the comment says which release it is.
jobs:
  backend:
    name: Backend (ruff + pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = local development venv, 3.15 = the Docker image (python:3.15-slim)
        python: ["3.13", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  security:
    name: Containers + Trivy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy - dependencies, secrets and Dockerfile/compose misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build images
        run: |
          docker build -t netsentinel-api:ci .
          docker build -f docker/web.Dockerfile -t netsentinel-web:ci .

      - name: Trivy - API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: netsentinel-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
          timeout: 15m

      - name: Trivy - dashboard image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: netsentinel-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
          timeout: 15m

      - name: Smoke test - docker compose up, health, real upload
        run: |
          docker compose up -d --build --wait
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/alerts | grep -q '<div id="root">'
          # Synthetic labelled capture (RFC 5737 addresses) generated by the image itself,
          # uploaded through nginx: must come back with the port-scan alert.
          docker compose exec -T api netsentinel make-scenarios /tmp/scenarios
          docker compose exec -T api cat /tmp/scenarios/port_scan_connect.pcap > scan.pcap
          curl -fsS -F "file=@scan.pcap" http://127.0.0.1:8080/api/analyses | tee result.json
          grep -q '"alert_count":1' result.json
          curl -fsS "http://127.0.0.1:8080/api/alerts?rule_id=NS-001" | grep -q '"severity":"high"'
          docker compose logs api | tail -n 5

      - name: Stop containers
        if: always()
        run: docker compose down -v
