# One public entry point: the dashboard files + /api forwarded to the API container.
# The browser sees a single origin, so no CORS is needed in production.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Must stay just above NETSENTINEL_MAX_UPLOAD_MB (50 MB): nginx rejects bigger bodies
    # with 413 before they reach Python.
    client_max_body_size 51m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Same ID in nginx and API logs, so one request can be followed end to end.
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;  # a 50 MB capture takes a while to analyze
    }

    # Built files have a content hash in their name: they can be cached for a long time.
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths (/alerts, /traffic) are routes handled by React.
    location / {
        try_files $uri /index.html;
    }
}
