[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel"
version = "0.0.1"
description = "Network traffic analysis and rule-based intrusion detection platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scapy>=2.8.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",  # needed by FastAPI to receive file uploads
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.28.1"]  # httpx powers FastAPI's TestClient

[project.scripts]
netsentinel = "netsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import order, B = bugbear, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]
